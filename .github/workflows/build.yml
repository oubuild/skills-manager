name: Build Desktop Apps

on:
  workflow_dispatch:          # 手动构建（只传 artifact）
  push:
    tags: ['v*']              # 发布构建（构建 + 传 Release）

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            label: macos-arm64
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            label: windows-x64
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # 显式缓存 cargo registry（依赖下载）
          cache-directories: |
            ~/.cargo/registry
            ~/.cargo/git
          # 使用 Cargo.lock 作为缓存 key，依赖没变就复用
          cache-on-failure: true
          # 跨 workflow 共享缓存
          shared-key: "tauri-build"

      # Linux: Tauri 系统依赖（webkit2gtk 等）
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # 版本号统一以 git tag 为准：构建前同步到 tauri.conf.json / Cargo.toml
      # （bumpp 只更新 package.json，Tauri 打包读的是 tauri.conf.json，必须显式同步）
      - name: Sync version from tag (before build)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 - "$VERSION" <<'EOF'
          import json, re, sys
          v = sys.argv[1]
          # tauri.conf.json
          p = "src-tauri/tauri.conf.json"
          conf = json.load(open(p))
          conf["version"] = v
          json.dump(conf, open(p, "w"), indent=2, ensure_ascii=False)
          open(p, "a").write("\n")
          # Cargo.toml
          p = "src-tauri/Cargo.toml"
          s = open(p).read()
          s = re.sub(r'(?m)^version = "[^"]*"', f'version = "{v}"', s, count=1)
          open(p, "w").write(s)
          print("synced version:", v)
          EOF

      - name: Build Tauri app (signed for updater)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          tauriScript: npx tauri
          # macOS 跳过 bundle_dmg.sh（macos-15 ARM runner 上依赖 Finder/AppleScript 易卡死）
          # 只打 app 包（生成 .app.tar.gz 更新产物），DMG 由后续步骤用 hdiutil 手动创建
          args: --target ${{ matrix.target }} ${{ runner.os == 'macOS' && '--bundles app' || '' }}

      # macOS: 用 hdiutil 直接打 DMG（绕过 flaky 的 bundle_dmg.sh）
      - name: Build DMG (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          VERSION=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          mkdir -p "src-tauri/target/${{ matrix.target }}/release/bundle/dmg"
          hdiutil create -volname "Skills Manager" \
            -srcfolder "src-tauri/target/${{ matrix.target }}/release/bundle/macos/Skills Manager.app" \
            -ov -format UDZO \
            "src-tauri/target/${{ matrix.target }}/release/bundle/dmg/Skills Manager_${VERSION}_aarch64.dmg"

      # ---- 归集产物（各平台 bundle 路径不同）----
      - name: Collect artifacts (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist
          cp src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg dist/
          cp src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz dist/
          cp src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig dist/
          ls -la dist/

      - name: Collect artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi dist/
          Copy-Item src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi.zip dist/ -ErrorAction SilentlyContinue
          Copy-Item src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi.zip.sig dist/ -ErrorAction SilentlyContinue
          Copy-Item src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe dist/ -ErrorAction SilentlyContinue
          Copy-Item src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe.zip dist/ -ErrorAction SilentlyContinue
          Copy-Item src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe.zip.sig dist/ -ErrorAction SilentlyContinue
          Get-ChildItem dist

      - name: Collect artifacts (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist
          cp src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb dist/ 2>/dev/null || true
          cp src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage dist/ 2>/dev/null || true
          cp src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage.tar.gz dist/ 2>/dev/null || true
          cp src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage.tar.gz.sig dist/ 2>/dev/null || true
          ls -la dist/

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: skills-manager-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error

  # 等三平台构建完：生成 latest.json 并发布 Release（安装包 + updater 产物）
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Generate latest.json
        shell: python3 {0}
        run: |
          import json, os, glob, urllib.parse

          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          tag = os.environ["GITHUB_REF_NAME"]
          base = f"https://cnb.cool/ryanuo/skills-manager/-/releases/download/{tag}"

          def find(pattern):
              files = sorted(glob.glob(f"dist/{pattern}"))
              return files[0] if files else None

          def entry(artifact_pattern, sig_pattern):
              art = find(artifact_pattern)
              if not art:
                  return None
              sigs = sorted(glob.glob(f"dist/{sig_pattern}"))
              sig = ""
              if sigs:
                  sig = open(sigs[0]).read().strip().splitlines()[0]
              name = os.path.basename(art)
              url = f"{base}/{urllib.parse.quote(name)}"
              return {"url": url, "signature": sig}

          platforms = {}
          p = entry("*.app.tar.gz", "*.app.tar.gz.sig")
          if p:
              platforms["darwin-aarch64"] = p
          p = entry("*.msi.zip", "*.msi.zip.sig") or entry("*setup.exe.zip", "*setup.exe.zip.sig") or entry("*.exe.zip", "*.exe.zip.sig")
          if p:
              platforms["windows-x86_64"] = p
          p = entry("*.AppImage.tar.gz", "*.AppImage.tar.gz.sig")
          if p:
              platforms["linux-x86_64"] = p

          data = {
              "version": version,
              "notes": f"Skills Manager {version}",
              "pub_date": __import__("datetime").datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms,
          }
          with open("latest.json", "w") as f:
              json.dump(data, f, indent=2)
          print(json.dumps(data, indent=2))
          # 校验：生成的文件必须能被严格解析（禁止控制字符）
          json.loads(open("latest.json").read(), strict=True)
          print("latest.json OK")

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*
            latest.json
          fail_on_unmatched_files: false
          generate_release_notes: true

  # 上传资产到 CNB 国内镜像 Release（国内下载加速）
  # 前置：cnb.cool 存在同名仓库 + .cnb.yml 自动建 Release + GitHub Secrets 配 GIT_PASSWORD
  upload-cnb:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release]
    runs-on: ubuntu-24.04
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Clone attachments plugin (fork)
        run: git clone --depth 1 https://cnb.cool/ryanuo/attachments.git plugin

      - name: Build plugin
        working-directory: plugin
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Upload to CNB Release
        env:
          CNB_TOKEN: ${{ secrets.GIT_PASSWORD }}
          CNB_API_ENDPOINT: 'https://api.cnb.cool'
          CNB_REPO_SLUG: 'ryanuo/skills-manager'
          PLUGIN_TAG: ${{ github.ref_name }}
          PLUGIN_ATTACHMENTS: './dist/*'
        run: node plugin/dist/entrypoint.js

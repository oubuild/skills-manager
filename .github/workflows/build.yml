name: Build Desktop Apps

on:
  workflow_dispatch:          # 手动构建（只传 artifact）
  push:
    tags: ['v*']              # 发布构建（构建 + 传 Release）

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            label: macos-arm64
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            label: windows-x64
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Linux: Tauri 系统依赖（webkit2gtk 等）
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app (signed for updater)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          tauriScript: npx tauri
          args: --target ${{ matrix.target }}

      # ---- 归集产物（各平台 bundle 路径不同）----
      - name: Collect artifacts (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist
          cp src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg dist/
          cp src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz dist/
          cp src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig dist/
          ls -la dist/

      - name: Collect artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi dist/
          Copy-Item src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi.zip dist/ -ErrorAction SilentlyContinue
          Copy-Item src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi.zip.sig dist/ -ErrorAction SilentlyContinue
          Copy-Item src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe dist/ -ErrorAction SilentlyContinue
          Copy-Item src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe.zip dist/ -ErrorAction SilentlyContinue
          Copy-Item src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe.zip.sig dist/ -ErrorAction SilentlyContinue
          Get-ChildItem dist

      - name: Collect artifacts (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist
          cp src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb dist/ 2>/dev/null || true
          cp src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage dist/ 2>/dev/null || true
          cp src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage.tar.gz dist/ 2>/dev/null || true
          cp src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage.tar.gz.sig dist/ 2>/dev/null || true
          ls -la dist/

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: skills-manager-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error

  # 等三平台构建完：生成 latest.json 并发布 Release（安装包 + updater 产物）
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Generate latest.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SIG_MAC=$(cat dist/*.app.tar.gz.sig | head -1)
          SIG_WIN=$(cat dist/*.msi.zip.sig 2>/dev/null | head -1 || cat dist/*.exe.zip.sig 2>/dev/null | head -1)
          SIG_LINUX=$(cat dist/*.AppImage.tar.gz.sig | head -1)
          BASE="https://github.com/oubuild/skills-manager/releases/download/${GITHUB_REF_NAME}"

          MAC_TAR=$(ls dist/*.app.tar.gz | xargs -n1 basename)
          WIN_UPD=$(ls dist/*.msi.zip 2>/dev/null | xargs -n1 basename || ls dist/*.exe.zip | xargs -n1 basename)
          LINUX_UPD=$(ls dist/*.AppImage.tar.gz | xargs -n1 basename)

          cat > latest.json <<EOF
          {
            "version": "$VERSION",
            "notes": "Skills Manager $VERSION",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "darwin-aarch64": {
                "url": "$BASE/$MAC_TAR",
                "signature": "$SIG_MAC"
              },
              "windows-x86_64": {
                "url": "$BASE/$WIN_UPD",
                "signature": "$SIG_WIN"
              },
              "linux-x86_64": {
                "url": "$BASE/$LINUX_UPD",
                "signature": "$SIG_LINUX"
              }
            }
          }
          EOF
          cat latest.json

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*
            latest.json
          fail_on_unmatched_files: false
          generate_release_notes: true

  # 上传资产到 CNB 国内镜像 Release（国内下载加速）
  # 前置：cnb.cool 存在同名仓库 + .cnb.yml 自动建 Release + GitHub Secrets 配 GIT_PASSWORD
  upload-cnb:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release]
    runs-on: ubuntu-24.04
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Clone attachments plugin (fork)
        run: git clone --depth 1 https://cnb.cool/ryanuo/attachments.git plugin

      - name: Build plugin
        working-directory: plugin
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Upload to CNB Release
        env:
          CNB_TOKEN: ${{ secrets.GIT_PASSWORD }}
          CNB_API_ENDPOINT: 'https://api.cnb.cool'
          CNB_REPO_SLUG: 'ryanuo/skills-manager'
          PLUGIN_TAG: ${{ github.ref_name }}
          PLUGIN_ATTACHMENTS: './dist/*'
        run: node plugin/dist/entrypoint.js

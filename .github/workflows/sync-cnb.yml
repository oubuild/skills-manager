# 同步代码到 CNB 国内镜像（cnb.cool/ryanuo/skills-manager）
# 前置：
#   1. 在 cnb.cool 创建同名仓库 ryanuo/skills-manager（可从 GitHub 导入）
#   2. CNB 生成访问令牌（个人设置 -> 访问令牌，勾「Git 客户端凭据」），添加到 GitHub Secrets: GIT_PASSWORD
name: Sync to CNB

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # 全部分支/tag（git-sync 需要）

      - name: Sync to CNB Repository
        uses: docker://tencentcom/git-sync
        env:
          PLUGIN_TARGET_URL: "https://cnb.cool/ryanuo/skills-manager.git"
          PLUGIN_AUTH_TYPE: "https"
          PLUGIN_USERNAME: "cnb"
          PLUGIN_PASSWORD: ${{ secrets.GIT_PASSWORD }}
          PLUGIN_FORCE: "true"
          PLUGIN_PUSH_TAGS: "true"
